<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador Digital</title>
  <script src="json/tema.js"></script>
  </head>
<body>
    <link rel="stylesheet" href="css/style.css">

  <header>
    <h1 id="lbl_contadorDigital" style="cursor: pointer;">Contador Digital</h1>
    <div class="header-right">
      <button id="btn_tema" class="btn-tema" aria-label="Ativar modo escuro">🌙</button>
      <button id="btn_cadastro" class="btn-cadastro">Cadastre-se</button>
      <button id="btn_login" class="btn-login">Login</button>
    </div>
  </header>

  <div id="overlay_login" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Login</h2>
        <button id="btn_fecharLogin" class="modal-close" aria-label="Fechar">&times;</button>
      </div>
      <form id="form_login">
        <label for="input_email">E-mail</label>
        <input type="email" id="input_email" placeholder="seu@email.com" required>

        <label for="input_senha">Senha</label>
        <div class="campo-senha">
          <input type="password" id="input_senha" placeholder="••••••••" required>
          <button type="button" class="btn-toggle-senha" data-alvo="input_senha" aria-label="Mostrar senha">👁</button>
        </div>

        <p id="msg_erroLogin" class="msg-erro"></p>

        <button type="submit" class="btn-login btn-login-submit">Entrar</button>
      </form>
    </div>
  </div>

  <div id="overlay_2fa" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Verificação em duas etapas</h2>
        <button id="btn_fechar2fa" class="modal-close" aria-label="Fechar">&times;</button>
      </div>
      <form id="form_2fa">
        <p>Enviamos um código de 6 dígitos para o seu e-mail.</p>

        <label for="input_codigo2fa">Código de verificação</label>
        <input type="text" id="input_codigo2fa" inputmode="numeric" maxlength="6" placeholder="000000" required>

        <p id="msg_erro2fa" class="msg-erro"></p>

        <button type="submit" class="btn-login btn-login-submit">Confirmar</button>
      </form>
    </div>
  </div>

  <script src="json/main.js"></script>
</body>
</html>
