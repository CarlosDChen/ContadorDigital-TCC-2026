<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Limite</title>
  <script src="json/tema.js"></script>
  </head>
<body>
    <link rel="stylesheet" href="css/style.css">

  <header>
    <h1 id="lbl_contadorDigital" style="cursor: pointer;">Contador Digital</h1>
    <nav>
      <button id="btn_lancamentos">Lançamentos</button>
      <button id="btn_relatorios">Relatórios</button>
      <button id="btn_calculadoraLimite">Calculadora de Limite</button>
      <button id="btn_tema" class="btn-tema" aria-label="Ativar modo escuro">🌙</button>
    </nav>
  </header>

  <div class="calculadora-grid">
    <div class="coluna-esquerda">
      <h2>Gastos deste mês</h2>
      <table class="datagrid">
        <thead>
          <tr>
            <th>Data</th>
            <th>Descrição</th>
            <th>Categoria</th>
            <th>Valor</th>
          </tr>
        </thead>
        <tbody id="tabela_gastosMesCalculadora"></tbody>
      </table>
    </div>

    <div class="coluna-direita"></div>
  </div>

  <script src="json/main.js"></script>
</body>
</html>
