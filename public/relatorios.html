<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios</title>
  </head>
<body>
    <link rel="stylesheet" href="css/style.css">

  <header>
    <h1 id="lbl_contadorDigital" style="cursor: pointer;">Contador Digital</h1>
    <nav>
      <button id="btn_lancamentos">Lançamentos</button>
      <button id="btn_relatorios">Relatórios</button>
      <button id="btn_limitesDeGastos">Limites de Gastos</button>
      <button id="btn_Calculadoras">Calculadoras</button>
    </nav>
  </header>

  <div class="filtros-relatorios">
    <label for="select_mesAnoRelatorio">Mês</label>
    <select id="select_mesAnoRelatorio"></select>
  </div>

  <div class="relatorios-grid">
    <div class="card-grafico">
      <h2>Gastos por Categoria</h2>
      <div class="grafico-corpo">
        <svg id="grafico_pizza_gastos" viewBox="0 0 200 200" role="img" aria-label="Gastos por categoria no mês selecionado"></svg>
        <ul id="legenda_pizza_gastos" class="legenda-grafico"></ul>
      </div>
      <table id="tabela_pizza_gastos" class="tabela-dados-grafico">
        <caption class="sr-only">Gastos por categoria no mês selecionado</caption>
        <thead>
          <tr>
            <th>Categoria</th>
            <th>Valor</th>
            <th>%</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div id="tooltip_grafico" class="tooltip-grafico"></div>

  <script src="json/main.js"></script>
</body>
</html>
